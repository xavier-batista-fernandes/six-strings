<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive guitar theory lessons: fretboard notes, intervals, scales, chords and CAGED, keys and progressions.">
<title>Six Strings</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#FFFFFF" id="theme-color">
<script>try{var t=JSON.parse(localStorage.getItem('sixstrings:theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky amp-panel header with 5 numbered lessons; each lesson = short reading column + a live fretboard you can click and hear. */
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface-2:#F6F6F6; --ink:#141414; --muted:#5E5E5E; --line:#DCDCDC;
  --accent:#141414; --accent-ink:#FFFFFF; --accent-soft:#ECECEC;
  --wood:#3B2418; --wood-2:#4A2E1F; --fret:#B9BEC6; --string:#D9D2C3; --inlay:#E8E2D6; --nut:#EDE6D6; --board-text:#C9BBA8;
  --iv-r:#D23B33; --iv-t:#E3A21A; --iv-f:#2C6FCC; --iv-s:#8650C4; --iv-o:#6E7684; --iv-ink:#FFFFFF; --iv-t-ink:#2A1E00;
  --good:#1E8A4C; --bad:#C2372F;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D; --surface:#171717; --surface-2:#202020; --ink:#EDEDED; --muted:#9A9A9A; --line:#2F2F2F;
  --accent:#EDEDED; --accent-ink:#111111; --accent-soft:#262626;
  --wood:#2A190F; --wood-2:#352014; --fret:#8E949D; --string:#BDB6A6; --inlay:#BFB8AA; --nut:#CFC7B4; --board-text:#A99A86;
  --iv-r:#F0574E; --iv-t:#F2B53A; --iv-f:#4D8DF0; --iv-s:#A57AE6; --iv-o:#7F8796; --iv-ink:#FFFFFF; --iv-t-ink:#2A1E00;
  --good:#3DBB72; --bad:#F06B62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0D0D; --surface:#171717; --surface-2:#202020; --ink:#EDEDED; --muted:#9A9A9A; --line:#2F2F2F;
  --accent:#EDEDED; --accent-ink:#111111; --accent-soft:#262626;
  --wood:#2A190F; --wood-2:#352014; --fret:#8E949D; --string:#BDB6A6; --inlay:#BFB8AA; --nut:#CFC7B4; --board-text:#A99A86;
  --iv-r:#F0574E; --iv-t:#F2B53A; --iv-f:#4D8DF0; --iv-s:#A57AE6; --iv-o:#7F8796; --iv-ink:#FFFFFF; --iv-t-ink:#2A1E00;
  --good:#3DBB72; --bad:#F06B62; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--f-body);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
.brand svg{width:30px;height:30px;flex:none;align-self:center;border-radius:7px;box-shadow:0 0 0 1px var(--line)}
.theme-btn{appearance:none;font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.theme-btn:hover{border-color:var(--muted)}
.theme-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sound-wrap{position:relative}
.sound-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:6;width:min(300px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sound-panel h4{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sound-panel .seg+h4{margin-top:14px}
.sound-panel p{margin:8px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:860px){nav.tabs{order:3;flex-basis:100%;margin-left:0}.sound-wrap{margin-left:auto}}
@media (max-width:560px){.theme-btn .tl{display:none}.brand small{display:none}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
nav.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:1px solid transparent;background:none;color:var(--muted);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:baseline}
.tab b{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent);}
.tab[aria-selected="true"] b{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:28px 64px}
section.lesson{display:grid;gap:28px}
.intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px 40px;align-items:start}
@media (max-width:820px){.intro{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6vw,60px);line-height:.95;margin:6px 0 14px;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.05;margin:0 0 6px;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 12px;max-width:65ch}
.lead{font-size:18px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.panel > p:last-child{margin-bottom:0}
.kicker{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px 20px;margin-bottom:14px}
.kicker p{margin:0}
.callout{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:15px}
.callout strong{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid3 .panel{padding:16px}
.grid3 .panel p{font-size:15px;margin:0}

.controls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;margin-bottom:14px}
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl > span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{appearance:none;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;line-height:1.2}
.seg button:hover,.btn:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg.notes button{font-family:var(--f-mono);font-size:13px;min-width:40px;padding:6px 6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn .ico{display:inline-block;width:0;height:0;border-left:8px solid currentColor;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:7px;vertical-align:0}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}

.boardwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-inline:-4px;padding-inline:4px}
.boardwrap svg{display:block;min-width:780px;width:100%;height:auto}
.board-cap{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:8px;align-items:center}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--ink);min-height:1.4em}

svg .wood{fill:var(--wood)} svg .wood2{fill:var(--wood-2)}
svg .fretline{stroke:var(--fret)} svg .nut{fill:var(--nut)} svg .inlay{fill:var(--inlay);opacity:.85}
svg .str{stroke:var(--string)} svg .slabel{fill:var(--muted);font:700 12px var(--f-mono)}
svg .fnum{fill:var(--muted);font:500 11px var(--f-mono)} svg .fnum.big{fill:var(--ink);font-weight:700}
svg .hit{fill:transparent;cursor:pointer} svg .hit:hover{fill:var(--accent);fill-opacity:.18}
svg .dot{stroke:var(--wood);stroke-width:1.5}
svg .dt{font:700 11px var(--f-mono);text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--iv-ink)}
svg .iv-r{fill:var(--iv-r)} svg .iv-t{fill:var(--iv-t)} svg .iv-f{fill:var(--iv-f)} svg .iv-s{fill:var(--iv-s)} svg .iv-o{fill:var(--iv-o)}
svg .dt.on-t{fill:var(--iv-t-ink)}
svg .plain{fill:var(--inlay)} svg .dt.on-plain{fill:var(--wood)}
svg .sharp{fill:var(--wood-2);stroke:var(--board-text);stroke-width:1} svg .dt.on-sharp{fill:var(--board-text);font-size:9.5px}
svg .mark{fill:var(--accent);stroke:var(--surface);stroke-width:3} svg .dt.on-mark{fill:var(--accent-ink);font-size:15px}
svg .ghost{opacity:.22}
svg .pulse{animation:pulse 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){svg .pulse{animation:none}}

/* chord box */
svg .cb-line{stroke:var(--muted)} svg .cb-nut{fill:var(--ink)} svg .cb-txt{fill:var(--muted);font:700 11px var(--f-mono)}
svg .cb-barre{fill:var(--ink);opacity:.18}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lg-r{background:var(--iv-r)} .lg-t{background:var(--iv-t)} .lg-f{background:var(--iv-f)} .lg-s{background:var(--iv-s)} .lg-o{background:var(--iv-o)}

/* strip */
.strip-wrap{overflow-x:auto}
.strip{display:grid;grid-template-columns:repeat(13,minmax(44px,1fr));gap:3px;min-width:600px}
.cell{background:var(--surface-2);border-radius:6px;padding:6px 2px;text-align:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid transparent}
.cell .n{display:block;font-size:15px;font-weight:700}
.cell .f{display:block;font-size:10px;opacity:.75}
.cell.on{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.cell.on.root{background:var(--iv-r);border-color:var(--iv-r);color:var(--iv-ink)}
.step{grid-row:2;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);border-top:2px solid var(--line);margin-inline:18px;padding-top:2px}
.step.h{border-color:var(--iv-r);color:var(--iv-r);font-weight:700}

/* quiz */
.quiz-top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;margin-bottom:10px}
.score{display:flex;gap:18px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.score b{color:var(--ink);font-size:18px;display:block;font-variant-numeric:tabular-nums}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:12px}
.answers button{appearance:none;font:700 15px var(--f-mono);padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.answers button.acc{font-size:12px;font-weight:500;color:var(--muted)}
.answers button:hover{border-color:var(--ink)}
.answers button.right{background:var(--good);border-color:var(--good);color:#fff}
.answers button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.feedback{font-weight:700;min-height:1.5em;margin-top:8px}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer} tbody tr:hover td{background:var(--surface-2)}
.ivchip{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;padding:0 6px;border-radius:12px;font:700 12px var(--f-mono);color:var(--iv-ink)}
.ivchip.t{color:var(--iv-t-ink)}
.bg-r{background:var(--iv-r)} .bg-t{background:var(--iv-t)} .bg-f{background:var(--iv-f)} .bg-s{background:var(--iv-s)} .bg-o{background:var(--iv-o)}

.facts{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;margin:4px 0 12px}
.facts div{min-width:0}
.facts span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts b{font-family:var(--f-mono);font-size:15px}

.chords{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.chordcard{appearance:none;font:inherit;color:inherit;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.chordcard:hover{border-color:var(--muted)}
.chordcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chordcard.playing{background:var(--accent-soft);border-color:var(--accent)}
.chordcard .rn{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1}
.chordcard .cn{font-family:var(--f-mono);font-weight:700;font-size:15px}
.chordcard .sub{font-size:12px;color:var(--muted)}
.chordcard svg{width:110px;height:auto}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.pair{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pair figure{margin:0;text-align:center}
.pair figcaption{font-family:var(--f-mono);font-weight:700}
.pair svg{width:120px;height:auto}

.prog{display:grid;gap:8px}
.progrow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.progrow .pname{font-weight:700;min-width:120px}
.progrow .pseq{font-family:var(--f-mono);font-size:14px;flex:1;min-width:0}
.progrow .pseq span{display:inline-block;padding:1px 4px;border-radius:4px}
.progrow .pseq span.on{background:var(--accent);color:var(--accent-ink)}
.progrow .pnote{font-size:13px;color:var(--muted);flex-basis:100%}
.finder{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:4px;min-width:540px}
.finder button{appearance:none;font:700 13px var(--f-mono);padding:7px 2px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer}
.finder button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.results{display:grid;gap:6px;margin-top:12px}
.result{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;padding:8px 12px;border-radius:8px;background:var(--surface-2)}
.result.best{background:var(--accent-soft)}
.result b{font-family:var(--f-mono)}
.footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<style>.tools{display:flex;align-items:center;gap:8px}@media (max-width:860px){.tools{margin-left:auto}}</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1A1A1A"/><rect x="13" y="10" width="4" height="44" rx="1" fill="#EDE6D6"/><line x1="38" y1="10" x2="38" y2="54" stroke="#8C8C8C" stroke-width="2.5"/><g stroke="#F4EFE4" stroke-linecap="round"><line x1="15" y1="14" x2="56" y2="14" stroke-width="1.6"/><line x1="15" y1="21.2" x2="56" y2="21.2" stroke-width="2"/><line x1="15" y1="28.4" x2="56" y2="28.4" stroke-width="2.4"/><line x1="15" y1="35.6" x2="56" y2="35.6" stroke-width="2.8"/><line x1="15" y1="42.8" x2="56" y2="42.8" stroke-width="3.2"/><line x1="15" y1="50" x2="56" y2="50" stroke-width="3.6"/></g><circle cx="47" cy="35.6" r="7.5" fill="#F0574E" stroke="#1A1A1A" stroke-width="2.5"/></svg>Six Strings <small>Guitar theory, one fret at a time</small></div>
    <nav class="tabs" role="tablist" data-i18n-aria="aria.lessons" aria-label="Lessons">
      <button class="tab" role="tab" data-tab="fretboard" id="tab-fretboard"><b>1</b><span data-i18n="tab.fretboard"></span></button>
      <button class="tab" role="tab" data-tab="intervals" id="tab-intervals"><b>2</b><span data-i18n="tab.intervals"></span></button>
      <button class="tab" role="tab" data-tab="scales" id="tab-scales"><b>3</b><span data-i18n="tab.scales"></span></button>
      <button class="tab" role="tab" data-tab="chords" id="tab-chords"><b>4</b><span data-i18n="tab.chords"></span></button>
      <button class="tab" role="tab" data-tab="keys" id="tab-keys"><b>5</b><span data-i18n="tab.keys"></span></button>
    </nav>
    <div class="tools">
    <div class="sound-wrap">
      <button class="theme-btn" type="button" id="sound-btn" aria-haspopup="true" aria-expanded="false" aria-controls="sound-panel"></button>
      <div class="sound-panel" id="sound-panel" hidden></div>
    </div>
    <button class="theme-btn" type="button" id="theme-btn" data-i18n-aria="theme.aria" aria-label="Color theme"></button>
    <div class="sound-wrap" id="lang-wrap">
      <button class="theme-btn" type="button" id="lang-btn" aria-haspopup="true" aria-expanded="false" aria-controls="lang-panel"></button>
      <div class="sound-panel" id="lang-panel" hidden></div>
    </div>
    </div>
  </div>
</header>

<main class="wrap">

<!-- 1 FRETBOARD -->
<section class="lesson" id="fretboard" role="tabpanel">
  <div class="intro">
    <div>
      <div class="eyebrow" data-i18n="fb.eyebrow"></div>
      <h1 data-i18n="fb.h1"></h1>
      <p class="lead" data-i18n="fb.lead"></p>
      <p data-i18n="fb.p1"></p>
      <p data-i18n="fb.p2"></p>
    </div>
    <div class="panel">
      <h3 data-i18n="fb.strip.h"></h3>
      <p class="muted" style="font-size:14px" data-i18n="fb.strip.p"></p>
      <div class="strip-wrap"><div class="strip" id="fb-strip"></div></div>
      <p class="muted" style="font-size:13px;margin-top:10px" data-i18n="fb.strip.key"></p>
    </div>
  </div>

  <div class="panel">
    <div class="kicker">
      <div><h2 data-i18n="fb.map.h"></h2><p class="muted" data-i18n="fb.map.p"></p></div>
      <div class="readout" id="fb-readout" aria-live="polite"></div>
    </div>

<script>

  if(k){const pc=LETTER_PC[l]+(acc==='#'?1:acc==='b'?-1:0);return (acc==='b'?noteF(pc):noteS(pc))+(k==='c'?suf:'');}

  for(let n=1;n<=frets;n++){const x=fretX(n,frets);h+=`<line class="fretline" x1="${x}" x2="${x}" y1="${TOPY-14}" y2="${TOPY+5*GAP+14}" stroke-width="2.4"/>`;}
  h+=`<rect class="nut" x="${nut-6}" y="${TOPY-14}" width="7" height="${5*GAP+28}" rx="1.5"/>`;

  h+=`<text class="fnum" x="34" y="${H-10}" text-anchor="middle">${t('open')}</text>`;
  if(o.onClick){for(let s=0;s<6;s++)for(let f=0;f<=frets;f++){const x0=f===0?18:fretX(f-1,frets),x1=f===0?50:fretX(f,frets);h+=`<rect class="hit" data-s="${s}" data-f="${f}" x="${x0}" y="${strY(s)-15}" width="${x1-x0}" height="30" rx="4"/>`;}}

    if(f<0){h+=`<text class="cb-txt" x="${x}" y="${y0-10}" text-anchor="middle">×</text>`;return;}
    const semi=(pcAt(s,f)-rootPc+12)%12,cls='iv-'+ivCls(semi),lab=o.notes?nn(pcAt(s,f),o.flats):ivShort(semi);

  return h+'</svg>';}

function strip(el,rootPc,ivs,flats,opt){
  opt=opt||{};let h='';const set=new Set(ivs.map(i=>i%12));
  for(let i=0;i<=12;i++){const pc=(rootPc+i)%12,on=set.has(i%12),isRoot=opt.markRoot&&i%12===0&&on;
    const sub=opt.sub==='fret'?t('fretN',{n:i}):(on?ivShort(i):'');
    h+=`<div class="cell${on?' on':''}${isRoot?' root':''}" style="grid-row:1;grid-column:${i+1}"><span class="n">${on||opt.showAll?nn(pc,flats):'·'}</span><span class="f">${sub||'&nbsp;'}</span></div>`;}
  const idx=[];for(let i=0;i<=12;i++)if(set.has(i%12))idx.push(i);
  for(let k=0;k<idx.length-1;k++){const a=idx[k],b=idx[k+1],d=b-a;const S=t('steps'),lab=d===1?S.h:d===2?S.w:d===3?S.wh:d+'';

  el.innerHTML=h;}

/* ========== 3. SCALES ========== */
const SCALES={ // names and descriptions live in i18n
  minPent:{ivs:[0,3,5,7,10]},
  majPent:{ivs:[0,2,4,7,9]},
  blues:{ivs:[0,3,5,6,7,10],base:'minPent'},
  major:{ivs:[0,2,4,5,7,9,11]},
  minor:{ivs:[0,2,3,5,7,8,10]}

function scName(k){return t('scales')[k].name;}
const sc={root:9,type:'minPent',pos:1,label:'iv'};
function shapesFor(rootPc,ivs){
  const n=ivs.length,per=n>=7?3:2,pcs=new Set(ivs.map(i=>(rootPc+i)%12)),order=ivs.map(i=>(rootPc+i)%12),out=[];
  for(let k=0;k<n;k++){const f0=(order[k]-4+12)%12;const seq=[];let p=40+f0;while(seq.length<per*6){if(pcs.has(p%12))seq.push(p);p++;}
    let pts=[];for(let s=0;s<6;s++)for(let j=0;j<per;j++){const pp=seq[s*per+j];pts.push({s,f:pp-TUNING[s]});}
    let mn=Math.min(...pts.map(q=>q.f)),mx=Math.max(...pts.map(q=>q.f));
    if(mn<0)pts=pts.map(q=>({s:q.s,f:q.f+12}));else if(mx>17&&mn>=12)pts=pts.map(q=>({s:q.s,f:q.f-12}));
    out.push(pts);}
  return out;}
function scaleShapes(){const S=SCALES[sc.type];if(!S.base)return shapesFor(sc.root,S.ivs);
  const base=shapesFor(sc.root,SCALES[S.base].ivs),extra=S.ivs.filter(i=>!SCALES[S.base].ivs.includes(i)).map(i=>(sc.root+i)%12);
  return base.map(pts=>{const res=pts.slice();for(let s=0;s<6;s++){const fs=pts.filter(q=>q.s===s).map(q=>q.f),lo=Math.min(...fs)-1,hi=Math.max(...fs)+1;
    for(let f=Math.max(0,lo);f<=hi;f++)if(extra.includes(pcAt(s,f)))res.push({s,f});}return res;});}
function drawSC(){
  const S=SCALES[sc.type],minorish=sc.type!=='major'&&sc.type!=='majPent',fl=usesFlats(sc.root,minorish),pcs=S.ivs.map(i=>(sc.root+i)%12);
  const shapes=scaleShapes();if(sc.pos>shapes.length)sc.pos=1;
  seg($('sc-pos'),[{label:t('sc.neck'),value:0}].concat(shapes.map((_,i)=>({label:t('sc.shape',{n:i+1}),value:i+1}))),sc.pos,v=>{sc.pos=v;drawSC();});
  const inShape=new Set(sc.pos?shapes[sc.pos-1].map(q=>q.s+':'+q.f):[]);const dots=[];
  for(let s=0;s<6;s++)for(let f=0;f<=17;f++){if(!pcs.includes(pcAt(s,f)))continue;const ghost=sc.pos>0&&!inShape.has(s+':'+f);dots.push(ivDot(s,f,sc.root,sc.label==='notes'?'notes':'iv',fl,{ghost}));}
  board($('sc-board'),{frets:17,dots,aria:t('sc.aria'),onClick:(s,f)=>play(midiAt(s,f))});
  const rn=nn(sc.root,fl),sname=scName(sc.type).toLowerCase();
  $('sc-strip-title').textContent=t('sc.strip.title',{root:rn,scale:sname});
  strip($('sc-strip'),sc.root,S.ivs,fl,{markRoot:true});
  $('sc-facts').innerHTML=`<div><span>${t('sc.notes')}</span><b>${pcs.map(p=>nn(p,fl)).join(' ')}</b></div><div><span>${t('sc.formula')}</span><b>${S.ivs.map(i=>i?ivShort(i):'1').join(' ')}</b></div><div><span>${t('sc.steps')}</span><b>${stepsOf(S.ivs)}</b></div>`;
  let rel='';
  if(sc.type==='minPent'||sc.type==='minor'){const r=(sc.root+3)%12;rel=t('sc.rel.minor',{root:rn,scale:sname,rel:nn(r,fl),relScale:scName(sc.type==='minPent'?'majPent':'major').toLowerCase()});}
  else if(sc.type==='majPent'||sc.type==='major'){const r=(sc.root+9)%12;rel=t('sc.rel.major',{root:rn,scale:sname,rel:nn(r,fl),relScale:scName(sc.type==='majPent'?'minPent':'minor').toLowerCase()});}
  else rel=t('sc.blue');
  $('sc-callout').innerHTML=`${fmt(t('scales')[sc.type].mood)} ${rel}`+(sc.type==='minPent'&&sc.root===9&&sc.pos===1?` <br><br>${t('sc.box')}`:'');
  $('sc-sub').textContent=sc.pos?t('sc.sub.shape',{n:sc.pos,total:shapes.length}):t('sc.sub.neck');
}
function scControls(){seg($('sc-root'),rootItems(),sc.root,v=>{sc.root=v;drawSC();});
  seg($('sc-type'),Object.keys(SCALES).map(k=>({label:scName(k),value:k})),sc.type,v=>{sc.type=v;drawSC();});
  seg($('sc-label'),['iv','notes'].map(v=>({label:t('sc.label.'+v),value:v})),sc.label,v=>{sc.label=v;drawSC();});}
scControls();
$('sc-play').addEventListener('click',()=>{stopSeq();let ms;
  if(sc.pos){ms=scaleShapes()[sc.pos-1].map(q=>midiAt(q.s,q.f)).sort((a,b)=>a-b);ms=[...new Set(ms)];}

const OPEN={maj:{0:[-1,3,2,0,1,0],2:[-1,-1,0,2,3,2],4:[0,2,2,1,0,0],7:[3,2,0,0,0,3],9:[-1,0,2,2,2,0]},min:{9:[-1,0,2,2,1,0],2:[-1,-1,0,2,3,1],4:[0,2,2,0,0,0]}};

  if(q==='dim'){let f=(r-9+12)%12;if(f<1)f+=12;return[-1,f,f+1,f+2,f+1,-1];}
  if(OPEN[q][r])return OPEN[q][r];
  const eOff=(r-4+12)%12,aOff=(r-9+12)%12;const E=q==='maj'?[0,2,2,1,0,0]:[0,2,2,0,0,0],A=q==='maj'?[-1,0,2,2,2,0]:[-1,0,2,2,1,0];
  return eOff<=aOff?E.map(f=>f<0?-1:f+eOff):A.map(f=>f<0?-1:f+aOff);}
const MODES={major:{ivs:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],rn:['I','ii','iii','IV','V','vi','vii°']},
             minor:{ivs:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],rn:['i','ii°','III','iv','v','VI','VII']}};
const PROGS={ // descriptions live in i18n
 major:[
  {n:'I – IV – V',seq:[0,0,3,3,4,4,0,0]},
  {n:'I – V – vi – IV',seq:[0,4,5,3]},
  {n:'I – vi – IV – V',seq:[0,5,3,4]},
  {n:'vi – IV – I – V',seq:[5,3,0,4]},
  {n:'ii – V – I',seq:[1,4,0,0]},
  {n:'12-bar blues',seq:[0,0,0,0,3,3,0,0,4,3,0,4]}],
 minor:[
  {n:'i – iv – v',seq:[0,0,3,3,4,4,0,0]},
  {n:'i – VI – III – VII',seq:[0,5,2,6]},
  {n:'i – VII – VI – VII',seq:[0,6,5,6]},
  {n:'i – iv – VII – III',seq:[0,3,6,2]}]};
const ky={root:7,mode:'major',playing:-1};
function keyChords(){const M=MODES[ky.mode],fl=usesFlats(ky.root,ky.mode==='minor');return M.ivs.map((iv0,i)=>{const r=(ky.root+iv0)%12,q=M.q[i];return{r,q,rn:M.rn[i],name:nn(r,fl)+(q==='min'?'m':q==='dim'?'°':''),frets:voicing(r,q),fl};});}
function drawKY(){const cs=keyChords();
  $('ky-cards').innerHTML=cs.map((c,i)=>`<button class="chordcard" type="button" data-i="${i}"><span class="rn">${c.rn}</span><span class="cn">${c.name}</span>${chordBox(c.frets,c.r,{aria:t('aria.chord',{name:c.name})})}<span class="sub">${t('q.'+c.q)}</span></button>`).join('');
  const PT=t('progs')[ky.mode];
  $('ky-prog').innerHTML=PROGS[ky.mode].map((p,pi)=>`<div class="progrow"><span class="pname">${PT[pi].name||p.n}</span><span class="pseq" data-p="${pi}">${p.seq.map(i=>`<span>${cs[i].name}</span>`).join(' ')}</span><button class="btn primary" type="button" data-play="${pi}"><span class="ico"></span>${t('play')}</button><span class="pnote">${fmt(PT[pi].note)}</span></div>`).join('');}
$('ky-cards').addEventListener('click',e=>{const c=e.target.closest('.chordcard');if(!c)return;ac();strum(keyChords()[+c.dataset.i].frets);});
$('ky-prog').addEventListener('click',e=>{const b=e.target.closest('[data-play]');if(!b)return;const pi=+b.dataset.play,was=b.dataset.on==='1';stopSeq();
  document.querySelectorAll('#ky-prog [data-play]').forEach(x=>{x.dataset.on='';x.innerHTML='<span class="ico"></span>'+t('play');});document.querySelectorAll('#ky-prog .pseq span').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('#ky-cards .chordcard').forEach(x=>x.classList.remove('playing'));if(was)return;
  b.dataset.on='1';b.textContent=t('stop');ac();const p=PROGS[ky.mode][pi],cs=keyChords(),spans=document.querySelectorAll(`#ky-prog .pseq[data-p="${pi}"] span`),beat=1350;
  p.seq.forEach((ci,k)=>{seqTimers.push(setTimeout(()=>{spans.forEach((x,j)=>x.classList.toggle('on',j===k));document.querySelectorAll('#ky-cards .chordcard').forEach((x,j)=>x.classList.toggle('playing',j===ci));strum(cs[ci].frets);
    seqTimers.push(setTimeout(()=>strum(cs[ci].frets),beat/2));},k*beat));});
  seqTimers.push(setTimeout(()=>{b.dataset.on='';b.innerHTML='<span class="ico"></span>'+t('play');spans.forEach(x=>x.classList.remove('on'));document.querySelectorAll('#ky-cards .chordcard').forEach(x=>x.classList.remove('playing'));},p.seq.length*beat+200));});
function kyControls(){seg($('ky-root'),rootItems(),ky.root,v=>{ky.root=v;stopSeq();drawKY();});
  seg($('ky-mode'),[{label:t('major'),value:'major'},{label:t('minor'),value:'minor'}],ky.mode,v=>{ky.mode=v;stopSeq();drawKY();});}
kyControls();drawKY();RENDER.push(kyControls,drawKY);

/* key finder */
const kf=new Set(['7:maj','0:maj','2:maj','4:min']);
function drawKF(){const g=$('kf-grid');g.innerHTML='';['maj','min'].forEach(q=>rootItems().forEach(({label:r,value:pc})=>{const id=pc+':'+q,b=document.createElement('button');b.type='button';b.textContent=r+(q==='min'?'m':'');b.setAttribute('aria-pressed',String(kf.has(id)));
  b.addEventListener('click',()=>{kf.has(id)?kf.delete(id):kf.add(id);b.setAttribute('aria-pressed',String(kf.has(id)));findKeys();});g.appendChild(b);}));findKeys();}
function findKeys(){const out=$('kf-results');if(!kf.size){out.innerHTML=`<p class="muted" style="margin:0">${t('kf.empty')}</p>`;return;}
  const sel=[...kf];const res=[];for(let k=0;k<12;k++){const M=MODES.major,set=new Set(M.ivs.map((iv0,i)=>((k+iv0)%12)+':'+M.q[i]));const hit=sel.filter(x=>set.has(x)).length;res.push({k,hit});}
  res.sort((a,b)=>b.hit-a.hit);const top=res[0].hit;const shown=res.filter(r=>r.hit===top&&top>0);
  if(!shown.length){out.innerHTML=`<p class="muted" style="margin:0">${t('kf.none')}</p>`;return;}
  out.innerHTML=(top<sel.length?`<p class="muted" style="margin:0">${t('kf.partial',{n:sel.length,top})}</p>`:'')+shown.map((r,i)=>{const fl=usesFlats(r.k,false),rel=(r.k+9)%12;
    return `<div class="result${i===0&&top===sel.length&&shown.length===1?' best':''}"><b>${t('kf.key',{key:nn(r.k,fl)})}</b><span class="muted">${t('kf.rel',{rel:nn(rel,fl),relChord:nn(rel,fl)+'m'})}</span></div>`;}).join('');}
$('kf-clear').addEventListener('click',()=>{kf.clear();drawKF();});
drawKF();RENDER.push(drawKF);

/* sound settings: tone and note length, saved per browser. Labels live in i18n under 'sound'. */
const SOUND_ICON='<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>';
function drawSound(){const SOUND_TEXT=t('sound'),b=$('sound-btn');b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${SOUND_ICON}</svg><span class="tl">${SOUND_TEXT.button}</span>`;
  b.title=`${SOUND_TEXT.title}: ${SOUND_TEXT.tones[tone]}, ${SOUND_TEXT.lengths[noteLen]}`;b.setAttribute('aria-label',b.title);
  const seg=(k,opts,cur)=>`<div class="seg" role="group" aria-label="${k==='tone'?SOUND_TEXT.tone:SOUND_TEXT.length}">`+Object.keys(opts).map(o=>`<button type="button" data-${k}="${o}" aria-pressed="${o===cur}">${opts[o]}</button>`).join('')+'</div>';
  $('sound-panel').innerHTML=`<h4>${SOUND_TEXT.tone}</h4>${seg('tone',SOUND_TEXT.tones,tone)}<h4>${SOUND_TEXT.length}</h4>${seg('len',SOUND_TEXT.lengths,noteLen)}<p>${SOUND_TEXT.hint}</p>`;}
function soundOpen(open){$('sound-panel').hidden=!open;$('sound-btn').setAttribute('aria-expanded',open);}
$('sound-btn').addEventListener('click',e=>{e.stopPropagation();langOpen(false);soundOpen($('sound-panel').hidden);});
$('sound-panel').addEventListener('click',e=>{e.stopPropagation();const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tone){tone=t.dataset.tone;store.set('tone',tone);}else if(t.dataset.len){noteLen=t.dataset.len;store.set('noteLen',noteLen);}else return;
  drawSound();stopSeq();play(52,0,.36);play(59,.18,.3);play(64,.36,.3);});
document.addEventListener('click',()=>soundOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sound-panel').hidden){soundOpen(false);$('sound-btn').focus();}});
drawSound();RENDER.push(drawSound);

/* theme: auto (follows the device) -> light -> dark */
const THEME_ICON={auto:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  light:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'};
let theme=store.get('theme','auto');if(!THEME_ICON[theme])theme='auto';
const darkMQ=window.matchMedia?window.matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){const root=document.documentElement;if(theme==='auto')root.removeAttribute('data-theme');else root.setAttribute('data-theme',theme);
  const isDark=theme==='dark'||(theme==='auto'&&darkMQ&&darkMQ.matches);$('theme-color').setAttribute('content',isDark?'#171717':'#FFFFFF');
  const b=$('theme-btn');b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${THEME_ICON[theme]}</svg><span class="tl">${t('theme.'+theme)}</span>`;
  b.title=t('theme.title',{label:t('theme.'+theme),auto:theme==='auto'});}
$('theme-btn').addEventListener('click',()=>{theme={auto:'light',light:'dark',dark:'auto'}[theme];store.set('theme',theme);applyTheme();});
if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',applyTheme);
applyTheme();RENDER.push(applyTheme);

/* language and note names: globe button in the header opens a panel like the sound one */
const GLOBE_ICON='<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/>';
function applyStatic(){const v={majorSteps:stepsOf(SCALES.major.ivs)};document.documentElement.lang=loc().htmlLang||lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n,v);});
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  const tag=document.querySelector('.brand small');if(tag)tag.textContent=t('tagline');
  const md=document.querySelector('meta[name="description"]');if(md)md.setAttribute('content',t('meta.description'));}
function drawLang(){const b=$('lang-btn'),sys=loc().notes,ks=Object.keys(sys);
  b.innerHTML=`<svg viewBox="0 0 24 24" aria-hidden="true">${GLOBE_ICON}</svg>`;
  b.title=`${t('aria.language')}: ${loc().name}${ks.length>1?' · '+t('aria.notes')+': '+NOTES.label:''}`;b.setAttribute('aria-label',b.title);
  const group=(label,html)=>`<h4>${label}</h4><div class="seg" role="group" aria-label="${label}">${html}</div>`;
  $('lang-panel').innerHTML=group(t('aria.language'),LANGS.map(c=>`<button type="button" data-lang="${c}" lang="${LOCALES[c].htmlLang||c}" aria-pressed="${c===lang}">${LOCALES[c].name}</button>`).join(''))
    +(ks.length>1?group(t('aria.notes'),ks.map(k=>`<button type="button" data-notation="${k}" aria-pressed="${k===notation}">${sys[k].label}</button>`).join('')):'');}
function langOpen(open){$('lang-panel').hidden=!open;$('lang-btn').setAttribute('aria-expanded',open);}
$('lang-btn').addEventListener('click',e=>{e.stopPropagation();soundOpen(false);langOpen($('lang-panel').hidden);});
$('lang-panel').addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;
  if(b.dataset.lang){store.set('lang',b.dataset.lang);setLocale(b.dataset.lang);}
  else if(b.dataset.notation){const m=store.get('notation',{});m[lang]=b.dataset.notation;store.set('notation',m);setLocale(lang);}else return;
  stopSeq();RENDER.forEach(f=>f());});
document.addEventListener('click',()=>langOpen(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('lang-panel').hidden){langOpen(false);$('lang-btn').focus();}});
applyStatic();drawLang();RENDER.unshift(applyStatic);RENDER.push(drawLang);

/* boot */
const h=(location.hash||'').slice(1);showTab(TABS.includes(h)?h:store.get('tab','fretboard'));
})();
</script>
</body>
